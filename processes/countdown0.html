<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>end of rehearsals</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'], 
                        'cedarville': ['Cedarville Cursive', 'cursive'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#efefe7] text-[#5e3131] h-screen w-screen flex flex-col items-center overflow-hidden m-0 p-0">

    <div class="w-full max-w-md flex-1 overflow-hidden">
        <img 
            src="https://poems.renj.top/processes/reduced/what%20has%20happened%20(1).png" 
            alt="what has happened..." 
            class="w-full h-full object-cover"
        />
    </div>

    <main class="text-center w-full max-w-md px-4 py-6 shrink-0">
        <h2 class="text-lg font-inter mb-1">rehearsals end in...</h2>
        
        <div id="countdown" class="text-3xl font-inter my-1">
            Loading...
        </div>
        
        <p class="text-2xl font-cedarville mt-1">what has happened has happened to me</p>
    </main>

    <div class="w-full max-w-md flex-1 overflow-hidden">
        <img 
            src="https://poems.renj.top/processes/reduced/has%20happened%20to%20me%20(1)%20(1).png" 
            alt="...has happened to me" 
            class="w-full h-full object-cover"
        />
    </div>

    <script>
        const countdownElement = document.getElementById('countdown');
        const targetDate = new Date('2026-05-03T00:00:00+08:00').getTime(); 

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                countdownElement.innerHTML = 'the time has arrived.';
                clearInterval(countdownInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
