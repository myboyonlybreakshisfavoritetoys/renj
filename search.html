<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>search site — renj's poems</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="renjfavicon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="cdn-loader.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pagefind Dependencies -->
    <link href="/_pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/_pagefind/pagefind-ui.js"></script>

    <style>
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-cedarville { font-family: 'Cedarville Cursive', cursive; }
        
        .image-gradient-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 30%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
            pointer-events: none;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }

        /* Pagefind Dark Mode Integration overrides */
        :root {
            --pagefind-ui-primary: #ffffff;
            --pagefind-ui-text: #ffffff;
            --pagefind-ui-background: #1a1a1a;
            --pagefind-ui-border: #333333;
            --pagefind-ui-tag: #2a2a2a;
        }
        .pagefind-ui .pagefind-ui__search-input {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            border: 1px solid #333333 !important;
            border-radius: 8px !important;
            font-family: 'Inter', sans-serif;
        }
        .pagefind-ui .pagefind-ui__result {
            border-bottom: 1px solid #222222 !important;
            padding: 1.5rem 0 !important;
        }
        .pagefind-ui .pagefind-ui__result-title a {
            color: #ffffff !important;
            font-family: 'Cedarville Cursive', cursive !important;
            font-size: 1.5rem !important;
            text-decoration: none !important;
        }
        .pagefind-ui .pagefind-ui__result-title a:hover {
            text-decoration: underline !important;
        }
        .pagefind-ui .pagefind-ui__result-excerpt {
            color: #9CA3AF !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.875rem !important;
            line-height: 1.6 !important;
        }
        .pagefind-ui .pagefind-ui__result-excerpt mark {
            background-color: rgba(255, 215, 0, 0.2) !important;
            color: #FFD700 !important;
            padding: 0 2px !important;
            border-radius: 2px !important;
        }
    </style>
</head>
<body class="bg-black text-white font-inter min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full flex flex-col items-center space-y-8">
        
        <!-- Main Content Area -->
        <main class="w-full flex flex-col items-center">
            <div class="w-full max-w-sm sm:max-w-xl lg:max-w-2xl flex flex-col items-start space-y-6">
                
                <!-- Banner Image with Navigation Bar -->
                <div class="relative w-full pt-8 animate-fade-in">
                    <img src="evermore/morephotos/archive.png" 
                         onerror="this.onerror=null; this.src='https://placehold.co/900x675/000000/FFFFFF?text=Search+Archive';" 
                         alt="search archive" 
                         class="w-full h-auto object-cover rounded-lg shadow-lg opacity-40" 
                         style="aspect-ratio: 4 / 3;">
                    
                    <div class="image-gradient-overlay"></div>
                    
                    <!-- Core Navigation -->
                    <nav class="absolute top-8 left-0 right-0 p-4 flex justify-around items-center text-white text-xs md:text-sm">
                        <a href="index.html" class="hover:underline">home</a>
                        <a href="cyclei.html" class="hover:underline">cycle i</a>
                        <a href="cycleii.html" class="hover:underline">cycle ii</a>
                        <a href="cycleiii.html" class="hover:underline">cycle iii</a>
                        <a href="manifesto.html" class="hover:underline">manifesto</a>
                    </nav>
                    
                    <h1 class="font-cedarville text-5xl md:text-7xl absolute bottom-4 left-4 z-10 animate-fade-in-up delay-100">
                        search files
                    </h1>
                </div>

                <!-- Pagefind Search Integration Container -->
                <div class="w-full pt-4 animate-fade-in-up delay-200">
                    <div id="search-bar" class="w-full"></div>
                </div>

            </div>
        </main>

        <!-- Footer Elements -->
        <footer class="w-full flex justify-between items-end text-xs md:text-sm mt-8 max-w-sm sm:max-w-xl lg:max-w-2xl">
            <div class="flex space-x-4">
                <a href="#" class="hover:underline">INSTAGRAM</a>
                <a href="#" class="hover:underline">FACEBOOK</a>
            </div>
            <div class="text-right flex items-center space-x-2">
                <p>sibulan, <span id="current-time"></span></p>
                <p>&copy; 2026</p>
                <img src="renjwhite.png" 
                     onerror="this.onerror=null; this.src='https://placehold.co/20x20/FFFFFF/000000?text=Logo';" 
                     alt="Renj Logo" 
                     class="h-5 w-auto">
            </div>
        </footer>

    </div>

    <script>
        // Real-Time Footer Engine
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const formattedHours = hours % 12 || 12;
            const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').textContent = `${formattedHours}:${formattedMinutes} ${ampm}`;
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Initialize Pagefind UI
        window.addEventListener('DOMContentLoaded', (event) => {
            new PagefindUI({ 
                element: "#search-bar", 
                showSubResults: true,
                resetFilters: false
            });
        });
    </script>

</body>
</html>
